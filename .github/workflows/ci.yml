name: build

on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CPM clones every third-party dependency into this directory; caching it keeps later runs off the network.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  buildability:
    name: buildability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Tests that need a real GPU device and a window are excluded: hosted runners have neither.
        # install-smoke-verify only recognizes POSIX artifact names (see tests/verify-install.cmake).
        include:
          - os: ubuntu-26.04
            exclude_tests: "lifecycle-smoke|camera-lifecycle|buffer-smoke|shape-buffer-smoke"
          - os: macos-latest
            exclude_tests: "lifecycle-smoke|camera-lifecycle|buffer-smoke|shape-buffer-smoke"
          - os: windows-latest
            exclude_tests: "lifecycle-smoke|camera-lifecycle|buffer-smoke|shape-buffer-smoke|install-smoke-verify"

    steps:
      - uses: actions/checkout@v4

      # Ninja drives cl.exe, which the default Windows shell does not expose.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CPM.cmake', 'cmake/Dependencies/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure
        run: cmake --preset debug -G Ninja

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug -E "${{ matrix.exclude_tests }}"
