name: build

on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CPM clones every third-party dependency into this directory; caching it keeps later runs off the network.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  buildability:
    name: buildability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Excluded everywhere: tests that need a real GPU device and a window - hosted runners have neither.
        # Windows also skips three tests that are not portable yet: install-smoke-verify (POSIX-only artifact
        # names), dependencies-smoke (the in-tree shared-framework consumer cannot find its DLLs), and
        # documentation-smoke (the Windows image ships Doxygen, so its HTML checks run there and fail, while
        # macOS and Linux skip them - leaving those assertions unexercised).
        include:
          - os: ubuntu-26.04
            exclude_tests: "lifecycle-smoke|camera-lifecycle|buffer-smoke|shape-buffer-smoke"
          - os: macos-latest
            exclude_tests: "lifecycle-smoke|camera-lifecycle|buffer-smoke|shape-buffer-smoke"
          - os: windows-latest
            exclude_tests: "lifecycle-smoke|camera-lifecycle|buffer-smoke|shape-buffer-smoke|install-smoke-verify|dependencies-smoke|documentation-smoke"

    steps:
      - uses: actions/checkout@v7

      # Ninja drives cl.exe, which the default Windows shell does not expose.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # The pinned SDL3 is newer than any distribution package, so it is always built from source and its
      # configure step requires the X11 development libraries on Linux.
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdecor-0-dev libdrm-dev libgbm-dev libpulse-dev \
            libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxrandr-dev

      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CPM.cmake', 'cmake/Dependencies/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure
        run: cmake --preset debug -G Ninja

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug -E "${{ matrix.exclude_tests }}"
