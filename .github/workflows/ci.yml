name: build

on:
  push:
    branches: [master, 'ci-*']
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CPM clones every third-party dependency into this directory; caching it keeps later runs off the network.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  # Compiler cache directory. The size cap keeps each cached entry small, so entries do not churn against the
  # repository's cache quota.
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 1G

jobs:
  buildability:
    name: buildability (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # test_prefix wraps the test command on platforms that need a headless display.
        include:
          - os: ubuntu-26.04
            preset: debug
            test_prefix: "xvfb-run -a"
          - os: macos-latest
            preset: debug
            test_prefix: ""
          - os: windows-latest
            preset: debug
            test_prefix: ""
          - os: windows-latest
            preset: debug-shared
            test_prefix: ""

    steps:
      - uses: actions/checkout@v7

      # Ninja drives cl.exe, which the default Windows shell does not expose.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # The pinned SDL3 is newer than any distribution package, so it is always built from source and its
      # configure step needs the X11 development libraries on Linux. Running the graphics tests there also needs
      # a Vulkan device (lavapipe) and a display (Xvfb). The validation layer matters: Debug builds ask SDL for
      # debug mode, and SDL silently continues without validation when the layer is missing. Doxygen builds the
      # framework manual, which the deploy-docs job publishes from this leg.
      - name: Install build and graphics dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen sccache mesa-vulkan-drivers vulkan-validationlayers xvfb \
            libasound2-dev libdecor-0-dev libdrm-dev libgbm-dev libpulse-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxrandr-dev

      # sccache is taken from the native package manager, never from a third-party action, so nothing here
      # depends on the Actions cache backend.
      - name: Install sccache (macOS)
        if: runner.os == 'macOS'
        run: brew install sccache

      # Chocolatey only packages sccache 0.9 (2023), which predates current MSVC, so pin the official release.
      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-pc-windows-msvc.zip" -OutFile sccache.zip
          Expand-Archive sccache.zip -DestinationPath "$env:RUNNER_TEMP/sccache-dist"
          $bin = Get-ChildItem "$env:RUNNER_TEMP/sccache-dist" -Recurse -Filter sccache.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $bin.DirectoryName

      # The Windows image ships Doxygen 1.10.0, which renders every \snippet as nothing at all (fixed in
      # 1.11.0), so pin a working version there: that is what lets the documentation fixture run rather than be
      # masked. Without a Doxygen the fixture still validates the configuration behaviour.
      - name: Install doxygen (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/doxygen/doxygen/releases/download/Release_1_13_0/doxygen-1.13.0.windows.x64.bin.zip" -OutFile doxygen.zip
          Expand-Archive doxygen.zip -DestinationPath "$env:RUNNER_TEMP/doxygen"
          $bin = Get-ChildItem "$env:RUNNER_TEMP/doxygen" -Recurse -Filter doxygen.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $bin.DirectoryName
      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CPM.cmake', 'cmake/Dependencies/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      # Deliberately a second cache: dependency sources are immutable per pin (content key, written once), while
      # the compiler cache accumulates (rolling key, newest restored first, bounded by SCCACHE_CACHE_SIZE).
      - uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-

      # The launcher is passed on the command line rather than through the environment so that it applies to this
      # build tree only: the fixture tests configure their own projects and would otherwise hit MSVC's shared-PDB
      # race (C1041) under sccache. For the same reason MSVC is asked for embedded debug information (/Z7);
      # the setting is ignored by the non-MSVC compilers.
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Doxygen treats documentation warnings as errors, so this gates the manual on every PR. The Linux leg
      # additionally feeds the GitHub Pages deployment below.
      - name: Build framework manual
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cmake --build --preset ${{ matrix.preset }} --target fcg-docs

      # The Pages artifact is only ever consumed from the default branch; PRs and ci-* branches skip the upload.
      - name: Upload manual artifact (Linux, master only)
        if: runner.os == 'Linux' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/${{ matrix.preset }}/docs/html

      # Debug builds ask SDL for debug mode, but SDL only enables the validation layer when it is installed and
      # otherwise carries on silently - and at the default log level (GPU=error) even its warning is suppressed.
      # Turn that silent degradation into a failure: the layer must actually be active on Linux.
      - name: Verify validation layer is active (Linux)
        if: runner.os == 'Linux'
        env:
          SDL_LOGGING: "*=info"
        run: xvfb-run -a build/${{ matrix.preset }}/bin/render-lifecycle 2>&1 | grep "Validation layers enabled"

      # Every test is attempted on every platform. The graphics tests run against whatever device the platform
      # provides - Metal, WARP or lavapipe - and the documentation fixture reports for itself when no usable
      # Doxygen is present, so nothing needs to be excluded here.
      - name: Test
        run: ${{ matrix.test_prefix }} ctest --preset ${{ matrix.preset }}

      # Stop the server so the post-job cache upload never sees open files, and report the hit rate.
      - name: sccache stats
        if: always()
        run: |
          sccache --show-stats
          sccache --stop-server || true

  # Publishes the manual built by the Linux buildability leg. Only runs once the whole matrix is green, and
  # never for pull requests (forks would not get the pages permission anyway).
  deploy-docs:
    name: deploy documentation
    needs: buildability
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
