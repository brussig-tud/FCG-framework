# Builds the Doxygen manual (fcg-docs target) and deploys it to GitHub Pages.
# Pull requests build only, so documentation warnings fail CI before merging.
name: Deploy documentation to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Build-only validation for proposed changes
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single job: build the manual, then deploy it (non-PR events only)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install documentation tooling
        run: sudo apt-get update && sudo apt-get install -y doxygen ninja-build
      - name: Configure
        run: >
          cmake -S . -B build/docs -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFCG_BUILD_DOCUMENTATION=ON
          -DFCG_BUILD_APPS=OFF
          -DFCG_INCLUDE_PACKAGING=OFF
      - name: Build documentation
        run: cmake --build build/docs --target fcg-docs
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
